# CI for stm32_zeuss.
#
# Two jobs, answering two different questions:
#
#   host-tests  - is the logic right?    Builds and runs tools/hosttest/run.sh
#                                        on a normal compiler. Seconds.
#   sanitizers  - is it doing anything   The same tests again, built with the
#                 it should not?         address and undefined-behaviour
#                                        checkers. These catch what only shows
#                                        up at run time: an index past the end
#                                        of an array, a signed overflow. On the
#                                        board such a write simply lands on
#                                        whatever variable is next and nothing
#                                        says a word.
#   estimator   - is the estimate right? Simulates a walk from the robot's
#                                        URDF (the Pi workspace) with ground truth,
#                                        runs the real fusion.c on the sensor
#                                        data that walk produces, and fails if
#                                        tilt, velocity or height are off. Also
#                                        fails if zeus_kinematics_model.h was
#                                        not regenerated after a URDF change.
#   firmware    - does it still build?   Cross-compiles for the STM32H7RS with
#                                        arm-none-eabi-gcc. Nothing else checks
#                                        this: a change can pass every host test
#                                        and still fail to compile for the board,
#                                        because the host tests build App sources
#                                        against a stub HAL, not the real one.
#
# Both run on pushes to main and on every pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-tests:
    # Both compilers, because one compiler's silence is not evidence. GCC
    # rejected a packed-member access in fusion.c that clang accepts without a
    # word, and it sat there through green local runs on a Mac - where `gcc`
    # is Apple clang under another name - until CI built it with real GCC.
    name: Host tests (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      # run.sh shells out to python3 for the C-vs-Python protocol layout check.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run host tests
        env:
          CC: ${{ matrix.cc }}
        run: tools/hosttest/run.sh

  sanitizers:
    # Same tests, same sources, run under the address and undefined-behaviour
    # checkers. This is how the unbounded bus index in act_on_rx() was found:
    # every test passed, and the write past the end of s_pos_age was invisible
    # until something was watching for it.
    name: Host tests (sanitizers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run host tests with sanitizers
        env:
          CC: clang
          SAN: '1'
        run: tools/hosttest/run.sh

  estimator:
    name: Estimator vs simulated walk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pinocchio
        run: pip install -r tools/requirements-kinematics.txt

      # The model is vendored at tools/model/zeus.urdf, so this needs nothing
      # external. It catches the mistake that actually happens: tables edited
      # by hand, or committed from a different model than the one in the tree.
      - name: Kinematics tables match the model in the tree
        run: |
          urdf=tools/model/zeus.urdf
          want=$(sha256sum "$urdf" | cut -d' ' -f1)
          have=$(grep -m1 -o 'sha256  [0-9a-f]*' Appli/App/zeus_kinematics_model.h | cut -d' ' -f3)
          pin=$(cat tools/model/zeus_urdf.sha256)
          if [ "$want" != "$have" ]; then
            echo "zeus_kinematics_model.h was generated from a different URDF"
            echo "  tables: $have"
            echo "  model:  $want"
            echo "run: python tools/gen_kinematics.py"
            exit 1
          fi
          if [ "$want" != "$pin" ]; then
            echo "tools/model/zeus_urdf.sha256 does not match the URDF beside it"
            echo "  pin:   $pin"
            echo "  model: $want"
            exit 1
          fi
          echo "tables, model and pin all agree ($want)"

      # The gait tables are generated from the vendored gait_library.npz, and
      # the policy refuses to enable if ref_angle differs from its own copy of
      # that stride by more than a degree. A hand-edited table, or one from a
      # different speed row, is therefore a robot that will not arm.
      - name: Gait tables match the vendored library
        run: |
          want=$(cat tools/model/gait_library.sha256)
          have=$(sha256sum tools/model/gait_library.npz | cut -d' ' -f1)
          if [ "$want" != "$have" ]; then
            echo "tools/model/gait_library.sha256 does not match the npz beside it"
            exit 1
          fi
          python3 tools/gen_gait_from_library.py --speed 0.30 \
                  --run z1_softland_tol05 --check

      - name: Simulated walk through fusion.c
        env:
          URDF: tools/model/zeus.urdf
          OUT: sim_out
        run: tools/sim/run.sh --check

      # Separately: has the WORKSPACE's model moved on without us? Needs the
      # private repo, so it runs only when a read-only token is available and
      # says so plainly when it is not. Everything above has already run.
      - name: Fetch the Pi workspace
        id: workspace
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: vismay5559/zeus_26
          path: workspace
          token: ${{ secrets.WORKSPACE_TOKEN }}

      - name: The vendored model is still the workspace's model
        if: steps.workspace.outcome == 'success'
        run: |
          want=$(sha256sum workspace/zeus_description/urdf/zeus.urdf | cut -d' ' -f1)
          have=$(cat tools/model/zeus_urdf.sha256)
          if [ "$want" != "$have" ]; then
            echo "::error title=Model drift::the workspace URDF has moved on and the firmware has not"
            echo "  vendored:  $have"
            echo "  workspace: $want"
            echo "refresh: cp .../zeus.urdf tools/model/ && python tools/gen_kinematics.py"
            exit 1
          fi
          echo "the vendored model is current ($want)"

      - name: Model drift NOT checked
        if: steps.workspace.outcome != 'success'
        run: |
          echo "::warning title=Model drift not checked::the Pi workspace was not"
          echo "cloned, so CI did NOT check whether tools/model/zeus.urdf is still the"
          echo "workspace's current model. Every other kinematics check DID run."
          echo
          echo "This is EXPECTED unless a WORKSPACE_TOKEN secret has been set. If the"
          echo "workspace is a private repo owned by another personal account, a GitHub"
          echo "fine-grained token cannot be scoped to it at all - the options are then a"
          echo "read-only deploy key, a classic PAT, or not bothering."
          echo
          echo "Not bothering is reasonable, because the check does not need CI: run"
          echo "tools/model/check_drift.sh on any machine with both clones. See"
          echo "tools/model/README.md."

  firmware:
    name: Firmware build (arm-none-eabi)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Install arm-none-eabi toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@0f385a70bcadabde2f265a69444380eae89f5d31 # v1
        with:
          release: '13.2.Rel1'

      - name: Install CMake and Ninja
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # The size of the image is worth seeing in the log: a change that
      # quietly costs 40 KB of flash is easier to notice here than on a
      # board that has stopped fitting.
      #
      # mx-generated.cmake builds Boot and Appli as ExternalProjects with
      # BINARY_DIR inside the source tree, so the images land in Boot/build
      # and Appli/build rather than under build/<preset>.
      - name: Report image size
        run: arm-none-eabi-size Boot/build/*.elf Appli/build/*.elf

      # The .hex is the one to flash: the ELF carries two zero-length LOAD
      # segments (DTCM stack/heap, non-cacheable buffers) that make
      # STM32CubeProgrammer abort against the external loader. Appli/CMakeLists
      # says so at the objcopy step, so both are uploaded and named for it.
      - name: Upload firmware images
        uses: actions/upload-artifact@v4
        with:
          name: nexus_first-${{ matrix.preset }}
          path: |
            Appli/build/nexus_first_Appli.elf
            Appli/build/nexus_first_Appli.hex
            Boot/build/nexus_first_Boot.elf
            Boot/build/nexus_first_Boot.hex
          if-no-files-found: error
